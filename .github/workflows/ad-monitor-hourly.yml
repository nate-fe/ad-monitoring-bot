name: ad-monitor-hourly

on:
  schedule:
    # Thin scheduler: GitHub cron on ad-monitor.yml can stop after workflow errors.
    - cron: '12 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ad-monitor-hourly
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ad-monitor workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ad-monitor.yml',
              ref: 'main',
            });
            core.info('Dispatched ad-monitor.yml (workflow_dispatch)');
