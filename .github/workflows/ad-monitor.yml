name: ad-monitor

on:
  schedule:
    # Runs every hour (UTC). GitHub may delay 5–15 min; re-register after workflow fixes.
    - cron: '5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ad-monitor
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    env:
      MONITOR_TARGET_URL_NEWS_VIEW: ${{ vars.MONITOR_TARGET_URL_NEWS_VIEW || vars.MONITOR_TARGET_URL_NEWS || secrets.MONITOR_TARGET_URL_NEWS_VIEW || secrets.MONITOR_TARGET_URL_NEWS || 'https://m.news.nate.com/view/20260223n02867?issue_sq=10477' }}
      MONITOR_TARGET_URL_NEWS_HOME: ${{ vars.MONITOR_TARGET_URL_NEWS_HOME || secrets.MONITOR_TARGET_URL_NEWS_HOME || 'https://m.news.nate.com/' }}
      MONITOR_TARGET_URL_PANN_VIEW: ${{ vars.MONITOR_TARGET_URL_PANN_VIEW || vars.MONITOR_TARGET_URL_PANN || secrets.MONITOR_TARGET_URL_PANN_VIEW || secrets.MONITOR_TARGET_URL_PANN }}
      MONITOR_TARGET_URL_PANN_HOME: ${{ vars.MONITOR_TARGET_URL_PANN_HOME || secrets.MONITOR_TARGET_URL_PANN_HOME || 'https://m.pann.nate.com/' }}
      SITE_URL: ${{ vars.SITE_URL }}
      MONITOR_IGNORE_ERROR_PATTERNS: ${{ vars.MONITOR_IGNORE_ERROR_PATTERNS || secrets.MONITOR_IGNORE_ERROR_PATTERNS }}
      MONITOR_TIMEOUT_MS: '20000'
      MONITOR_USER_AGENT: 'ad-monitoring-bot/1.0 (github-actions)'
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Install Playwright browsers (Chromium)
        if: env.MONITOR_TARGET_URL_NEWS_VIEW != '' || env.MONITOR_TARGET_URL_NEWS_HOME != '' || env.MONITOR_TARGET_URL_PANN_VIEW != '' || env.MONITOR_TARGET_URL_PANN_HOME != ''
        run: npx playwright install --with-deps chromium

      - name: Build site (for GitHub Pages)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Run monitor targets
        continue-on-error: true
        run: npm run monitor:all

      - name: Update history files
        run: npm run history:update:all

      - name: Write legacy flat aliases
        run: npm run aliases:flat

      - name: Copy monitor outputs into dist
        run: |
          mkdir -p dist/news dist/pann
          cp -r public/news dist/
          cp -r public/pann dist/
          ls -la dist | sed -n '1,160p'
          ls -la dist/news | sed -n '1,160p'
          ls -la dist/news/view | sed -n '1,160p'
          ls -la dist/news/home | sed -n '1,160p'
          ls -la dist/pann | sed -n '1,160p'
          ls -la dist/pann/view | sed -n '1,160p'
          ls -la dist/pann/home | sed -n '1,160p'

      - name: Deploy to Vercel (optional)
        timeout-minutes: 5
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_AUTHOR_EMAIL: ${{ secrets.VERCEL_GIT_AUTHOR_EMAIL }}
          VERCEL_GIT_AUTHOR_NAME: ${{ secrets.VERCEL_GIT_AUTHOR_NAME || github.repository_owner }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deploy."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_ORG_ID or VERCEL_PROJECT_ID not set — skipping Vercel deploy."
            exit 0
          fi
          if [ -z "$VERCEL_GIT_AUTHOR_EMAIL" ]; then
            echo "ERROR: VERCEL_GIT_AUTHOR_EMAIL is required (Vercel Hobby/Team blocks unknown commit authors)."
            exit 1
          fi
          git config user.email "$VERCEL_GIT_AUTHOR_EMAIL"
          git config user.name "$VERCEL_GIT_AUTHOR_NAME"
          git commit --amend --no-edit --reset-author
          echo "Git author for Vercel: $VERCEL_GIT_AUTHOR_NAME <$VERCEL_GIT_AUTHOR_EMAIL>"
          VITE_BASE="/" npm run build
          mkdir -p dist/news dist/pann
          cp -r public/news dist/
          cp -r public/pann dist/
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          node ./scripts/prepare-vercel-prebuilt.js
          # --prebuilt: Actions에서 만든 dist를 그대로 올림 (Vercel 원격 vite build 방지)
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
          echo "Vercel production deploy completed."

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitor-report
          path: |
            public/news/view/monitor-report.json
            public/news/home/monitor-report.json
            public/pann/view/monitor-report.json
            public/pann/home/monitor-report.json
          if-no-files-found: ignore

      - name: Create issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Ad monitor failed: ${new Date().toISOString()}`;
            const body = [
              'Monitoring run failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- News view target: ${(process.env.MONITOR_TARGET_URL_NEWS_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_VIEW variable/secret)'}`,
              `- News home target: ${(process.env.MONITOR_TARGET_URL_NEWS_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_HOME variable/secret)'}`,
              `- Pann view target: ${(process.env.MONITOR_TARGET_URL_PANN_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_VIEW variable/secret)'}`,
              `- Pann home target: ${(process.env.MONITOR_TARGET_URL_PANN_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_HOME variable/secret)'}`,
              '',
              'Check the workflow logs and the uploaded artifact `monitor-report` for details.',
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

  deploy:
    needs: monitor
    if: needs.monitor.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
