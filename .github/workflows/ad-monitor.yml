name: ad-monitor

on:
  schedule:
    # Re-registered 2026-06-11: hourly at :17 UTC (GitHub may delay 5–15 min)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      sync_until:
        description: 'History includes through this date (YYYY-MM-DD). Example 2026-06-10'
        required: false
        type: string
      backfill_only:
        description: 'Deploy synced JSON only (skip monitor and history update)'
        required: false
        type: boolean
        default: false

concurrency:
  # 동시 실행 대신 대기열 — cancel 시 Pages deploy가 중간에 끊기며 충돌함
  group: ad-monitor-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.upload_pages.conclusion == 'success' }}
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    env:
      MONITOR_TARGET_URL_NEWS_VIEW: ${{ vars.MONITOR_TARGET_URL_NEWS_VIEW || vars.MONITOR_TARGET_URL_NEWS || secrets.MONITOR_TARGET_URL_NEWS_VIEW || secrets.MONITOR_TARGET_URL_NEWS || 'https://m.news.nate.com/view/20260223n02867?issue_sq=10477' }}
      MONITOR_TARGET_URL_NEWS_HOME: ${{ vars.MONITOR_TARGET_URL_NEWS_HOME || secrets.MONITOR_TARGET_URL_NEWS_HOME || 'https://m.news.nate.com/' }}
      MONITOR_TARGET_URL_PANN_VIEW: ${{ vars.MONITOR_TARGET_URL_PANN_VIEW || vars.MONITOR_TARGET_URL_PANN || secrets.MONITOR_TARGET_URL_PANN_VIEW || secrets.MONITOR_TARGET_URL_PANN }}
      MONITOR_TARGET_URL_PANN_HOME: ${{ vars.MONITOR_TARGET_URL_PANN_HOME || secrets.MONITOR_TARGET_URL_PANN_HOME || 'https://m.pann.nate.com/' }}
      MONITOR_TARGET_URL_NEWS_PC_VIEW: ${{ vars.MONITOR_TARGET_URL_NEWS_PC_VIEW || vars.MONITOR_TARGET_URL_NEWS_PC || secrets.MONITOR_TARGET_URL_NEWS_PC_VIEW || secrets.MONITOR_TARGET_URL_NEWS_PC || 'https://news.nate.com/view/20260615n08067' }}
      MONITOR_TARGET_URL_NEWS_PC_HOME: ${{ vars.MONITOR_TARGET_URL_NEWS_PC_HOME || secrets.MONITOR_TARGET_URL_NEWS_PC_HOME || 'https://news.nate.com/' }}
      MONITOR_TARGET_URL_PANN_PC_VIEW: ${{ vars.MONITOR_TARGET_URL_PANN_PC_VIEW || vars.MONITOR_TARGET_URL_PANN_PC || secrets.MONITOR_TARGET_URL_PANN_PC_VIEW || secrets.MONITOR_TARGET_URL_PANN_PC || 'https://pann.nate.com/talk/375431569' }}
      MONITOR_TARGET_URL_PANN_PC_HOME: ${{ vars.MONITOR_TARGET_URL_PANN_PC_HOME || secrets.MONITOR_TARGET_URL_PANN_PC_HOME || 'https://pann.nate.com/' }}
      MONITOR_IGNORE_ERROR_PATTERNS: ${{ vars.MONITOR_IGNORE_ERROR_PATTERNS || secrets.MONITOR_IGNORE_ERROR_PATTERNS }}
      MONITOR_TIMEOUT_MS: '20000'
      MONITOR_USER_AGENT: 'ad-monitoring-bot/1.0 (github-actions)'
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      JSON_SYNC_UNTIL: ${{ inputs.sync_until || vars.JSON_SYNC_UNTIL || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Seed JSON from yoonzeen Pages (nate-fe only)
        if: github.repository_owner == 'nate-fe'
        run: npm run json:sync

      - name: Install Playwright browsers (Chromium)
        if: (github.event_name != 'workflow_dispatch' || inputs.backfill_only != true) && (env.MONITOR_TARGET_URL_NEWS_VIEW != '' || env.MONITOR_TARGET_URL_NEWS_HOME != '' || env.MONITOR_TARGET_URL_PANN_VIEW != '' || env.MONITOR_TARGET_URL_PANN_HOME != '' || env.MONITOR_TARGET_URL_NEWS_PC_VIEW != '' || env.MONITOR_TARGET_URL_NEWS_PC_HOME != '' || env.MONITOR_TARGET_URL_PANN_PC_VIEW != '' || env.MONITOR_TARGET_URL_PANN_PC_HOME != '')
        run: npx playwright install --with-deps chromium

      - name: Build site (for GitHub Pages)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Run monitor targets
        if: github.event_name != 'workflow_dispatch' || inputs.backfill_only != true
        continue-on-error: true
        run: npm run monitor:all

      - name: Update history files
        if: github.event_name != 'workflow_dispatch' || inputs.backfill_only != true
        run: npm run history:update:all

      - name: Write legacy flat aliases
        run: npm run aliases:flat

      - name: Copy monitor outputs into dist
        run: |
          mkdir -p dist/news dist/pann
          cp -r public/news dist/
          cp -r public/pann dist/
          ls -la dist | sed -n '1,160p'
          ls -la dist/news | sed -n '1,160p'
          ls -la dist/news/view | sed -n '1,160p'
          ls -la dist/news/home | sed -n '1,160p'
          ls -la dist/news/pc/view | sed -n '1,160p'
          ls -la dist/news/pc/home | sed -n '1,160p'
          ls -la dist/pann | sed -n '1,160p'
          ls -la dist/pann/view | sed -n '1,160p'
          ls -la dist/pann/home | sed -n '1,160p'
          ls -la dist/pann/pc/view | sed -n '1,160p'
          ls -la dist/pann/pc/home | sed -n '1,160p'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitor-report
          path: |
            public/news/view/monitor-report.json
            public/news/home/monitor-report.json
            public/news/pc/view/monitor-report.json
            public/news/pc/home/monitor-report.json
            public/pann/view/monitor-report.json
            public/pann/home/monitor-report.json
            public/pann/pc/view/monitor-report.json
            public/pann/pc/home/monitor-report.json
          if-no-files-found: ignore

      - name: Create issue on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Ad monitor failed: ${new Date().toISOString()}`;
            const body = [
              'Monitoring run failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- News view target: ${(process.env.MONITOR_TARGET_URL_NEWS_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_VIEW variable/secret)'}`,
              `- News home target: ${(process.env.MONITOR_TARGET_URL_NEWS_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_HOME variable/secret)'}`,
              `- Pann view target: ${(process.env.MONITOR_TARGET_URL_PANN_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_VIEW variable/secret)'}`,
              `- Pann home target: ${(process.env.MONITOR_TARGET_URL_PANN_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_HOME variable/secret)'}`,
              `- News PC view target: ${(process.env.MONITOR_TARGET_URL_NEWS_PC_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_PC_VIEW variable/secret)'}`,
              `- News PC home target: ${(process.env.MONITOR_TARGET_URL_NEWS_PC_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS_PC_HOME variable/secret)'}`,
              `- Pann PC view target: ${(process.env.MONITOR_TARGET_URL_PANN_PC_VIEW && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_PC_VIEW variable/secret)'}`,
              `- Pann PC home target: ${(process.env.MONITOR_TARGET_URL_PANN_PC_HOME && '(configured)') || '(missing MONITOR_TARGET_URL_PANN_PC_HOME variable/secret)'}`,
              '',
              'Check the workflow logs and the uploaded artifact `monitor-report` for details.',
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

  deploy:
    needs: monitor
    if: needs.monitor.outputs.pages_ready == 'true'
    concurrency:
      group: pages-deploy-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
