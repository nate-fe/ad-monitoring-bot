name: ad-monitor

on:
  schedule:
    # Runs every hour (UTC). GitHub schedules can drift slightly.
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ad-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    env:
      MONITOR_TARGET_URL_NEWS: ${{ vars.MONITOR_TARGET_URL_NEWS || secrets.MONITOR_TARGET_URL_NEWS || 'https://m.news.nate.com/view/20260223n02867?issue_sq=10477' }}
      MONITOR_TARGET_URL_PANN: ${{ vars.MONITOR_TARGET_URL_PANN || secrets.MONITOR_TARGET_URL_PANN }}
      MONITOR_IGNORE_ERROR_PATTERNS: ${{ vars.MONITOR_IGNORE_ERROR_PATTERNS || secrets.MONITOR_IGNORE_ERROR_PATTERNS }}
      MONITOR_TIMEOUT_MS: '20000'
      MONITOR_USER_AGENT: 'ad-monitoring-bot/1.0 (github-actions)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        if: env.MONITOR_TARGET_URL_NEWS != '' || env.MONITOR_TARGET_URL_PANN != ''
        run: npx playwright install --with-deps chromium

      - name: Build site (for GitHub Pages)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Run monitor for scoped targets
        continue-on-error: true
        run: |
          mkdir -p dist
          mkdir -p dist/news dist/pann

          if [ -n "${MONITOR_TARGET_URL_NEWS}" ]; then
            MONITOR_TARGET_SCOPE="news" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS}" MONITOR_REPORT_PATH="dist/news/monitor-report.json" npm run monitor || true
          else
            cat > dist/news/monitor-report.json <<'EOF'
            {
              "ok": false,
              "url": "",
              "status": 0,
              "durationMs": 0,
              "checkedAt": "",
              "failures": ["news monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS)"],
              "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
            }
            EOF
          fi

          if [ -n "${MONITOR_TARGET_URL_PANN}" ]; then
            MONITOR_TARGET_SCOPE="pann" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN}" MONITOR_REPORT_PATH="dist/pann/monitor-report.json" npm run monitor || true
          else
            cat > dist/pann/monitor-report.json <<'EOF'
            {
              "ok": false,
              "url": "",
              "status": 0,
              "durationMs": 0,
              "checkedAt": "",
              "failures": ["pann monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN)"],
              "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
            }
            EOF
          fi

          ls -la dist | sed -n '1,160p'
          ls -la dist/news | sed -n '1,160p'
          ls -la dist/pann | sed -n '1,160p'

      - name: Update news history.json
        env:
          MONITOR_TARGET_SCOPE: news
          HISTORY_SOURCE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news/history.json
          REPORT_PATH: dist/news/monitor-report.json
          HISTORY_PATH: dist/news/history.json
          HISTORY_MAX: '720'
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ./scripts/update-history.js

      - name: Update pann history.json
        env:
          MONITOR_TARGET_SCOPE: pann
          HISTORY_SOURCE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pann/history.json
          REPORT_PATH: dist/pann/monitor-report.json
          HISTORY_PATH: dist/pann/history.json
          HISTORY_MAX: '720'
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ./scripts/update-history.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report
          path: |
            dist/news/monitor-report.json
            dist/pann/monitor-report.json
          if-no-files-found: ignore

      - name: Create issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Ad monitor failed: ${new Date().toISOString()}`;
            const body = [
              'Monitoring run failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- News target: ${(process.env.MONITOR_TARGET_URL_NEWS && '(configured)') || '(missing MONITOR_TARGET_URL_NEWS variable/secret)'}`,
              `- Pann target: ${(process.env.MONITOR_TARGET_URL_PANN && '(configured)') || '(missing MONITOR_TARGET_URL_PANN variable/secret)'}`,
              '',
              'Check the workflow logs and the uploaded artifact `monitor-report` for details.',
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
