image: mcr.microsoft.com/playwright:v1.58.2-jammy

# 전역 타임아웃을 10분으로 넉넉하게 설정
variables:
  FF_USE_FASTZIP: "true"
  # Playwright Docker image already contains browsers.
  # Avoid re-downloading browsers during `npm ci/install` (can be huge and lead to job timeouts).
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  npm_config_fund: "false"
  npm_config_audit: "false"

pages:
  stage: deploy
  timeout: 10m  # 이 작업이 최대 10분까지 돌 수 있게 허용
  script:
    - node --version
    - npm --version
    - npm ci
    # Build dashboard for GitLab Pages
    - VITE_BASE="/${CI_PROJECT_NAME}/" npm run build

    # Generate scoped monitor-report.json files into dist/ so they are always deployed.
    - |
      mkdir -p dist
      mkdir -p dist/news dist/pann

      if [ -n "${MONITOR_TARGET_URL_NEWS}" ]; then
        MONITOR_TARGET_SCOPE="news" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS}" MONITOR_REPORT_PATH="dist/news/monitor-report.json" npm run monitor || true
      else
        cat > dist/news/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["news monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_PANN}" ]; then
        MONITOR_TARGET_SCOPE="pann" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN}" MONITOR_REPORT_PATH="dist/pann/monitor-report.json" npm run monitor || true
      else
        cat > dist/pann/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["pann monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

    # Append scoped history.json files (best-effort; if Pages URL is not available yet, they will start fresh).
    - |
      MONITOR_TARGET_SCOPE="news" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/news/history.json" \
      REPORT_PATH="dist/news/monitor-report.json" \
      HISTORY_PATH="dist/news/history.json" \
      HISTORY_MAX="720" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="pann" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/pann/history.json" \
      REPORT_PATH="dist/pann/monitor-report.json" \
      HISTORY_PATH="dist/pann/history.json" \
      HISTORY_MAX="720" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true

    - rm -rf public && mkdir -p public
    - cp -r dist/* public/
    - ls -la public | sed -n '1,160p'
  artifacts:
    paths:
      - public
  only:
    - main