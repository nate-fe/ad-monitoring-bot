image: mcr.microsoft.com/playwright:v1.58.2-jammy

variables:
  FF_USE_FASTZIP: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  npm_config_fund: "false"
  npm_config_audit: "false"

stages:
  - deploy

pages:
  stage: deploy
  timeout: 10m
  script:
    - node --version
    - npm --version
    - npm ci
    - VITE_BASE="/${CI_PROJECT_NAME}/" npm run build

    - |
      mkdir -p dist
      mkdir -p dist/news/view dist/news/home dist/news/pc/view dist/news/pc/home
      mkdir -p dist/pann/view dist/pann/home dist/pann/pc/view dist/pann/pc/home

      if [ -n "${MONITOR_TARGET_URL_NEWS_VIEW}" ]; then
        MONITOR_TARGET_SCOPE="news" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS_VIEW}" MONITOR_REPORT_PATH="dist/news/view/monitor-report.json" npm run monitor || true
      else
        cat > dist/news/view/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["news view monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS_VIEW)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_NEWS_HOME}" ]; then
        MONITOR_TARGET_SCOPE="news-home" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS_HOME}" MONITOR_REPORT_PATH="dist/news/home/monitor-report.json" npm run monitor || true
      else
        cat > dist/news/home/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["news home monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS_HOME)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_NEWS_PC_VIEW}" ]; then
        MONITOR_TARGET_SCOPE="news-pc" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS_PC_VIEW}" MONITOR_REPORT_PATH="dist/news/pc/view/monitor-report.json" npm run monitor || true
      else
        cat > dist/news/pc/view/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["news pc view monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS_PC_VIEW)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_NEWS_PC_HOME}" ]; then
        MONITOR_TARGET_SCOPE="news-pc-home" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_NEWS_PC_HOME}" MONITOR_REPORT_PATH="dist/news/pc/home/monitor-report.json" npm run monitor || true
      else
        cat > dist/news/pc/home/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["news pc home monitor-report.json was not produced (missing MONITOR_TARGET_URL_NEWS_PC_HOME)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_PANN_VIEW}" ]; then
        MONITOR_TARGET_SCOPE="pann" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN_VIEW}" MONITOR_REPORT_PATH="dist/pann/view/monitor-report.json" npm run monitor || true
      else
        cat > dist/pann/view/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["pann view monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN_VIEW)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_PANN_HOME}" ]; then
        MONITOR_TARGET_SCOPE="pann-home" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN_HOME}" MONITOR_REPORT_PATH="dist/pann/home/monitor-report.json" npm run monitor || true
      else
        cat > dist/pann/home/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["pann home monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN_HOME)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_PANN_PC_VIEW}" ]; then
        MONITOR_TARGET_SCOPE="pann-pc" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN_PC_VIEW}" MONITOR_REPORT_PATH="dist/pann/pc/view/monitor-report.json" npm run monitor || true
      else
        cat > dist/pann/pc/view/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["pann pc view monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN_PC_VIEW)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

      if [ -n "${MONITOR_TARGET_URL_PANN_PC_HOME}" ]; then
        MONITOR_TARGET_SCOPE="pann-pc-home" MONITOR_TARGET_URL="${MONITOR_TARGET_URL_PANN_PC_HOME}" MONITOR_REPORT_PATH="dist/pann/pc/home/monitor-report.json" npm run monitor || true
      else
        cat > dist/pann/pc/home/monitor-report.json <<'EOF'
        {
          "ok": false,
          "url": "",
          "status": 0,
          "durationMs": 0,
          "checkedAt": "",
          "failures": ["pann pc home monitor-report.json was not produced (missing MONITOR_TARGET_URL_PANN_PC_HOME)"],
          "diagnostics": { "pageErrors": [], "consoleMessages": [], "requestFailures": [] }
        }
        EOF
      fi

    - |
      MONITOR_TARGET_SCOPE="news" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/news/view/history.json" \
      REPORT_PATH="dist/news/view/monitor-report.json" \
      HISTORY_PATH="dist/news/view/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="news-home" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/news/home/history.json" \
      REPORT_PATH="dist/news/home/monitor-report.json" \
      HISTORY_PATH="dist/news/home/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="news-pc" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/news/pc/view/history.json" \
      REPORT_PATH="dist/news/pc/view/monitor-report.json" \
      HISTORY_PATH="dist/news/pc/view/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="news-pc-home" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/news/pc/home/history.json" \
      REPORT_PATH="dist/news/pc/home/monitor-report.json" \
      HISTORY_PATH="dist/news/pc/home/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="pann" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/pann/view/history.json" \
      REPORT_PATH="dist/pann/view/monitor-report.json" \
      HISTORY_PATH="dist/pann/view/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="pann-home" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/pann/home/history.json" \
      REPORT_PATH="dist/pann/home/monitor-report.json" \
      HISTORY_PATH="dist/pann/home/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="pann-pc" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/pann/pc/view/history.json" \
      REPORT_PATH="dist/pann/pc/view/monitor-report.json" \
      HISTORY_PATH="dist/pann/pc/view/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - |
      MONITOR_TARGET_SCOPE="pann-pc-home" \
      HISTORY_SOURCE_URL="${CI_PAGES_URL}/pann/pc/home/history.json" \
      REPORT_PATH="dist/pann/pc/home/monitor-report.json" \
      HISTORY_PATH="dist/pann/pc/home/history.json" \
      HISTORY_MAX="26280" \
      GITHUB_RUN_URL="" \
      node ./scripts/update-history.js || true
    - node ./scripts/write-legacy-flat-aliases.js dist || true

    - rm -rf public && mkdir -p public
    - cp -r dist/* public/
    - ls -la public | sed -n '1,160p'
  artifacts:
    paths:
      - public
  only:
    - main
