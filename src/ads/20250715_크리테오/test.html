<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="area_ad09"></div>
    <script>
        (function () {
            var $ad_id = 'criteo-471211'
            var $ad_width = 728;
            var $ad_height = 90;

            var adArea = document.querySelector('.area_ad09');

            try {
                var $script = document.createElement('script');
                $script.type = 'text/javascript';
                $script.src = 'https://static.criteo.net/js/ld/publishertag.js';
                $script.async = true;

                var $div = document.createElement('div');
                $div.id = $ad_id;

                $script.onload = function () {
                    window.Criteo = window.Criteo || {}; window.Criteo.events = window.Criteo.events || [];

                    Criteo.events.push(function () {
                        var adUnits = {
                            'networkId': 1669,
                            'publisherId': '108926',
                            'placements': [{
                                'slotid': $ad_id,
                                'zoneId': 1830972,
                                'sizes': ['728x90'],
                                'ext': {
                                    'bidder': {
                                        'uid': 471211
                                    },
                                    'floors': {
                                        'banner': {
                                            '728x90': {
                                                'floor': 230,
                                                'currency': 'KRW'
                                            }
                                        }
                                    }
                                }
                            }]
                        };
                        Criteo.Passback.RequestBids(adUnits, 2000);
                    });

                    Criteo.events.push(function () {
                        Criteo.Passback.RenderAd($ad_id, function () {
                            var slotid = $ad_id;
                            var div = document.getElementById(slotid);
                            if (div) {
                                var ifr = document.createElement('iframe');
                                ifr.setAttribute('id', slotid + '_iframe'),
                                    ifr.setAttribute('frameborder', '0'),
                                    ifr.setAttribute('allowtransparency', 'true'),
                                    ifr.setAttribute('hspace', '0'),
                                    ifr.setAttribute('marginwidth', '0'),
                                    ifr.setAttribute('marginheight', '0'),
                                    ifr.setAttribute('scrolling', 'no'),
                                    ifr.setAttribute('vspace', '0'),
                                    ifr.setAttribute('width', $ad_width),
                                    ifr.setAttribute('height', $ad_height);
                                div.appendChild(ifr);
                                var htmlcode = '<html><head></head><body><script language=javascript src="https://cyad1.nate.com/js.kti/nate/cri@back_Bottom1"></scr' + 'ipt></body></html>';
                                var ifrd = ifr.contentWindow.document;
                                ifrd.open();
                                ifrd.write(htmlcode);
                                ifrd.close();
                            }
                        });
                    });
                }

                adArea.appendChild($script);
                adArea.appendChild($div);
            } catch (e) { console.warn(e) }
        })();
    </script>
</body>
</html>
